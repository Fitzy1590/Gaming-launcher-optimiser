name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/FitzLauncher.Core.Tests -c Release

      - name: Publish (self-contained, ReadyToRun)
        run: >
          dotnet publish src/FitzLauncher.App -c Release -r win-x64 --self-contained true
          -p:PublishReadyToRun=true -o publish/FitzLauncher

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/FitzLauncher/* -DestinationPath FitzLauncher-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FitzLauncher-win-x64
          path: FitzLauncher-win-x64.zip

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FitzLauncher-win-x64.zip
          generate_release_notes: true
