name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Every build gets a unique, increasing version; the launcher's updater compares against it.
  VERSION: 0.3.${{ github.run_number }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/FitzLauncher.Core.Tests -c Release

      - name: Publish (self-contained, ReadyToRun)
        run: >
          dotnet publish src/FitzLauncher.App -c Release -r win-x64 --self-contained true
          -p:PublishReadyToRun=true -p:Version=${{ env.VERSION }} -o publish/FitzLauncher

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/FitzLauncher/* -DestinationPath FitzLauncher-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FitzLauncher-win-x64
          path: FitzLauncher-win-x64.zip

      # Successful builds of main become a Release, which is what "Check for updates" looks at.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Fitz Launcher ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: FitzLauncher-win-x64.zip
          generate_release_notes: true
          make_latest: true
